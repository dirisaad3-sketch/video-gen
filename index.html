<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد الفيديو من الصور</title>
<style>
:root{--bg:#12141a;--card:#1c1f28;--line:#2c3040;--tx:#eef0f6;--mut:#8b91a6;--ac:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
.wrap{max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input,textarea{width:100%;background:#12141a;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px}
textarea{min-height:90px;resize:vertical}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
.drop img{max-width:100%;max-height:220px;border-radius:10px}
button{width:100%;background:var(--ac);color:#04210f;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#status{font-size:13px;color:var(--mut);margin-top:10px;min-height:18px;white-space:pre-wrap}
#status.err{color:#f87171}
video{width:100%;border-radius:12px;margin-top:8px;background:#000}
a.dl{display:block;text-align:center;margin-top:10px;color:var(--ac);font-size:14px}
small{color:var(--mut);display:block;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 مولّد الفيديو من الصور</h1>

  <div class="card">
    <label>مفتاح API (من fal.ai)</label>
    <input id="key" type="password" placeholder="ألصق المفتاح هنا" autocomplete="off">
    <small>يُحفظ في متصفحك فقط ولا يُرسل إلا إلى fal.ai.</small>
    <label style="margin-top:12px">النموذج</label>
    <input id="model" value="fal-ai/wan-i2v" dir="ltr">
  </div>

  <div class="card">
    <label>الصورة</label>
    <label class="drop" id="drop" for="file" style="display:block">اضغط لاختيار صورة</label>
    <input id="file" type="file" accept="image/*" hidden>
    <label style="margin-top:12px">الأمر (Prompt)</label>
    <textarea id="prompt" placeholder="مثال: الكاميرا تقترب ببطء، الشعر يتحرك مع الريح، إضاءة سينمائية"></textarea>
  </div>

  <button id="go">إنشاء الفيديو</button>
  <div id="status"></div>

  <div class="card" id="out" hidden>
    <video id="vid" controls playsinline loop></video>
    <a class="dl" id="dl" target="_blank" rel="noopener" download>⬇️ تحميل الفيديو</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let imgData = null;

try {
  $('key').value = localStorage.getItem('fal_key') || '';
  $('model').value = localStorage.getItem('fal_model') || $('model').value;
} catch (e) {}

window.onerror = (m) => { $('status').textContent = 'خطأ في الصفحة: ' + m; $('status').className = 'err'; };
$('status').textContent = 'الصفحة جاهزة ✅';
$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s);
    c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    imgData = c.toDataURL('image/jpeg', 0.9);
    $('drop').innerHTML = '';
    const p = document.createElement('img');
    p.src = imgData;
    $('drop').appendChild(p);
    URL.revokeObjectURL(url);
  };
  img.src = url;
};

const sleep = ms => new Promise(r => setTimeout(r, ms));
function say(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }

$('go').onclick = async () => {
  const key = $('key').value.trim();
  const model = $('model').value.trim().replace(/^\/+|\/+$/g, '');
  const prompt = $('prompt').value.trim();
  if (!key) return say('أدخل مفتاح API أولاً', true);
  if (!imgData) return say('اختر صورة أولاً', true);
  if (!prompt) return say('اكتب الأمر أولاً', true);
  try { localStorage.setItem('fal_key', key); localStorage.setItem('fal_model', model); } catch (e) {}

  const headers = { 'Authorization': 'Key ' + key, 'Content-Type': 'application/json' };
  $('go').disabled = true;
  $('out').hidden = true;
  try {
    say('جارٍ إرسال الطلب...');
    const r = await fetch('https://queue.fal.run/' + model, {
      method: 'POST', headers,
      body: JSON.stringify({ prompt, image_url: imgData })
    });
    const job = await r.json();
    if (!r.ok) throw new Error(job.detail ? JSON.stringify(job.detail) : 'خطأ ' + r.status);

    let tries = 0;
    while (true) {
      await sleep(3000);
      tries++;
      const s = await fetch(job.status_url, { headers });
      const sj = await s.json();
      if (sj.status === 'COMPLETED') break;
      if (sj.status === 'FAILED' || sj.error) throw new Error('فشل التوليد');
      say('الحالة: ' + (sj.status === 'IN_QUEUE' ? 'في الانتظار' + (sj.queue_position != null ? ' (رقم ' + sj.queue_position + ')' : '') : 'قيد المعالجة') + ' — ' + tries * 3 + ' ثانية');
      if (tries > 200) throw new Error('انتهت المهلة');
    }

    const res = await fetch(job.response_url, { headers });
    const rj = await res.json();
    const v = rj.video && rj.video.url;
    if (!v) throw new Error('لم يصل رابط الفيديو');
    $('vid').src = v;
    $('dl').href = v;
    $('out').hidden = false;
    say('تم ✅');
  } catch (e) {
    say('خطأ: ' + e.message, true);
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
